<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="1" stop-color="#1d6a96"/>
    </linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe14d"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 망토 (뒤로 휘날리는) -->
  <path d="M256 150
           C 150 150, 120 230, 96 360
           C 150 330, 190 340, 210 372
           L 256 300
           L 302 372
           C 322 340, 362 330, 416 360
           C 392 230, 362 150, 256 150 Z"
        fill="url(#cape)" opacity="0.92"/>

  <!-- 몸통 (어깨~가슴) -->
  <path d="M256 168
           C 196 168, 168 210, 168 270
           C 168 330, 200 372, 200 372
           L 312 372
           C 312 372, 344 330, 344 270
           C 344 210, 316 168, 256 168 Z"
        fill="#ffffff"/>

  <!-- 머리 -->
  <circle cx="256" cy="150" r="52" fill="#ffffff"/>

  <!-- 아이 마스크 (배경색 띠) -->
  <path d="M210 138
           C 224 122, 288 122, 302 138
           C 296 162, 216 162, 210 138 Z"
        fill="url(#bg)"/>

  <!-- 가슴 별 엠블럼 -->
  <path d="M256 236
           L 269 272 L 307 272 L 277 295
           L 288 332 L 256 309 L 224 332
           L 235 295 L 205 272 L 243 272 Z"
        fill="url(#bg)"/>
</svg>
